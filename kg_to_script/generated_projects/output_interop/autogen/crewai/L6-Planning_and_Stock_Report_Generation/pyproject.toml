[project]
name = "group_chat_teamfor_blog_generation"
version = "0.1.0"
description = "Team instantiated by GroupChat(agents=[...]) with a max_round and allowed speake"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.10,<=3.13"

dependencies = [
    "crewai[tools]>=0.152.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
]

[project.scripts]
group_chat_teamfor_blog_generation = "main:run"
train      = "main:train"

[tool.uv]
dev-dependencies = []

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
