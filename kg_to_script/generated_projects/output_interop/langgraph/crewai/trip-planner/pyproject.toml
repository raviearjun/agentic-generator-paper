[project]
name = "trip_planner_app_team"
version = "0.1.0"
description = "Team representing the LangGraph-backed trip planner UI and backend flows."
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.10,<=3.13"

dependencies = [
    "crewai[tools]>=0.152.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    # TODO: add PyPI package for custom tool "BookAccommodationTool"
]

[project.scripts]
trip_planner_app_team = "main:run"
train      = "main:train"

[tool.uv]
dev-dependencies = []

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
