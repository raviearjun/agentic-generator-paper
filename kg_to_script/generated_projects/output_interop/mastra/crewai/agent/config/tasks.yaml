    In my kitchen I have: pasta, canned tomatoes, garlic, olive oil, and some dried herbs (basil and oregano). What can I make?
  expected_output: Natural language recipe suggestions and possible ingredient substitutions.
task_generate_text:
  description: |
    In my kitchen I have: pasta, canned tomatoes, garlic, olive oil, and some dried herbs (basil and oregano). What can I make?
