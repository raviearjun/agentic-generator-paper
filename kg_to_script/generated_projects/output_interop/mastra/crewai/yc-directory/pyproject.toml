[project]
name = "mastra_instanceycagent"
version = "0.1.0"
description = "Mastra instance constructed in src/mastra/index.ts with a single agent 'ycAgent'"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.10,<=3.13"

dependencies = [
    "crewai[tools]>=0.152.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "anthropic>=0.60.0",
    # TODO: add PyPI package for custom tool "YCDirectoryTool"
]

[project.scripts]
mastra_instanceycagent = "main:run"
train      = "main:train"

[tool.uv]
dev-dependencies = []

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
