task_get_agent_card:
  description: Retrieve agent card metadata (getAgentCard / getExtendedAgentCard).
  expected_output: AgentCard JSON object containing metadata about the agent.
task_send_message:
  description: Send a single message to an agent and receive a message or task response.
  expected_output: A SendMessageResponse (Message or Task).
task_send_message_stream:
  description: Initiate a streaming message to receive real-time task events.
  expected_output: Streamed A2A events (Message, Task, TaskStatusUpdateEvent, TaskArtifactUpdateEvent).
task_get_task:
  description: Query status and result of an existing task.
  expected_output: GetTaskResponse containing current task data.
task_cancel_task:
  description: Cancel a running task for the agent.
  expected_output: Task object representing the cancelled task or confirmation of
    cancellation.
task_resubscribe_task:
  description: Resume a previously started task stream to receive ongoing updates.
  expected_output: Streamed A2A events for the existing task.
task_set_push_notification_config:
  description: Set push notification configuration for a task.
  expected_output: Acknowledgement and the stored TaskPushNotificationConfig.
task_get_push_notification_config:
  description: Get push notification configuration for a task.
  expected_output: The TaskPushNotificationConfig for the requested task.
task_list_push_notification_config:
  description: List push notification configurations.
  expected_output: A list of TaskPushNotificationConfig objects.
task_delete_push_notification_config:
  description: Delete a push notification configuration for a task.
  expected_output: Confirmation of deletion (void response or success envelope).
