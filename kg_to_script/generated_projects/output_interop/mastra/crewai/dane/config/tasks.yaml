  expected_output: 'Completed: task_pkg_assemble_packages'
task_tel_step_a2:
  description: Prompt user for a message (inquirer input)
  expected_output: 'Completed: task_tel_step_a2'
task_commit_generate_message:
  description: |
    Given the git diff, generate a conventional commit message; obey guidelines (start with verb, concise, first line <50 chars, add body if needed). Return commitMessage, generated flag, and guidelines array.
  expected_output: 'Completed: task_commit_generate_message'
task_first_create_message:
