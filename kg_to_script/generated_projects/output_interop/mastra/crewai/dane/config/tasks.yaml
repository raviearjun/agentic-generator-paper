task_changelog_step_a1:
  description: Get a git diff and connect to slack; runs git diff via execa
  expected_output: 'Completed: task_changelog_step_a1'
task_entry_message_input:
  description: Prompt user to input a message (inquirer prompt)
  expected_output: 'Completed: task_entry_message_input'
task_commit_get_diff:
  description: Compute git diff of staged changes via git command
  expected_output: 'Completed: task_commit_get_diff'
task_first_get_pull_request:
  description: Retrieve pull request data from GitHub integration and fetch diff
  expected_output: 'Completed: task_first_get_pull_request'
task_issue_get_issue:
  description: Retrieve issue and repository labels using GitHub integration
  expected_output: 'Completed: task_issue_get_issue'
task_link_get_broken_links:
  description: Run linkinator via shell to collect links; parse JSON output
  expected_output: 'Completed: task_link_get_broken_links'
task_pkg_get_pacakges_to_publish:
  description: |
    Please analyze the following monorepo directories and identify packages that need pnpm publishing:
    CRITICAL: This step is about planning. We do not want to build anything. All packages MUST be placed in the correct order.

    Publish Requirements:
    - @mastra/core first, MUST be before any other package
    - all packages in correct dependency order before building
    - Identify packages that have changes requiring a new pnpm publish
    - Include create-mastra in the packages list if changes exist
    - EXCLUDE @mastra/dane from consideration

    Please list all packages that need building grouped by their directory.
    DO NOT NOT USE the 'pnpmBuild' tool during this step.
  expected_output: 'Completed: task_pkg_get_pacakges_to_publish'
task_tel_step_a1:
  description: Create starting message for telephone game
  expected_output: 'Completed: task_tel_step_a1'
task_changelog_step_a2:
  description: |
    Time: recent week
    Git diff to generate from: (git diff from previous step)
    Task:
    1. create a structured narrative changelog that highlights key updates and improvements.
    2. Include what packages were changed
    Structure: Opening, Major Updates, Technical Improvements, Documentation & Examples, Bug Fixes & Infrastructure
    Finally send this to the configured slack channel with slack_post_message tool.
  expected_output: 'Completed: task_changelog_step_a2'
task_entry_message_output:
  description: |
    User-supplied message forwarded to Dane agent for response; context includes threadId and resourceId.
  expected_output: 'Completed: task_entry_message_output'
task_commit_read_conventional_commit_spec:
  description: Read conventional commit spec using fsTool
  expected_output: 'Completed: task_commit_read_conventional_commit_spec'
task_first_message_generator:
  description: |
    Given PR title, body, and diff plus Mastra docs, generate a friendly intro, a checklist (if applicable), and an outro thanking the contributor. Do not summarize code or give code advice.
  expected_output: 'Completed: task_first_message_generator'
task_issue_label_issue:
  description: Given issue title, body, and available repo labels, propose one or
    more labels to assign.
  expected_output: 'Completed: task_issue_label_issue'
task_link_report_broken_links:
  description: |
    Format the broken links JSON into a human-friendly Slack message and send to the configured channel using slack_post_message tool.
  expected_output: 'Completed: task_link_report_broken_links'
task_pkg_assemble_packages:
  description: Assemble file system paths for the packages reported by the agent and
